---
name: Semantic Release
on:
  push:
    branches:
      - main
  workflow_call:
    inputs:
      GH_SEM_REL_APP_ID:
        type: string
        required: false
        description: GitHub App ID used to create the GitHub App token.
      semantic_release_plugins:
        type: string
        required: false
        description: Space-separated list of additional semantic-release plugins to install.
    secrets:
      GH_SEM_REL_APP_PEM_FILE:
        required: false

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Create GitHub App token
        uses: actions/create-github-app-token@v3
        id: gh-app-token
        if: inputs.GH_SEM_REL_APP_ID != ''
        with:
          app-id: ${{ inputs.GH_SEM_REL_APP_ID }}
          private-key: ${{ secrets.GH_SEM_REL_APP_PEM_FILE }}
          repositories: ${{ github.repository }}
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          token: ${{ steps.gh-app-token.outputs.token || secrets.GITHUB_TOKEN }}
          fetch-depth: 0
          persist-credentials: true
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 'lts/*'
      - name: Install Semantic Release  # zizmor: ignore[adhoc-packages] lockfiles are not committed by design
        env:
          SEMANTIC_RELEASE_PLUGINS: ${{ inputs.semantic_release_plugins }}
        run: |
          mapfile -t plugins <<< "$SEMANTIC_RELEASE_PLUGINS"
          npm install --ignore-scripts semantic-release conventional-changelog-conventionalcommits@9 @semantic-release/changelog @semantic-release/git "${plugins[@]}"
      - name: Verify Semantic Release
        run: npm audit signatures
      - name: Run Semantic Release
        env:
          GITHUB_TOKEN: ${{ steps.gh-app-token.outputs.token || secrets.GITHUB_TOKEN }}
        run: npx semantic-release
      - name: Move major tags
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          git fetch --force --prune --prune-tags origin
          re='^(v(0|[1-9][0-9]*))\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(\+[0-9A-Za-z.-]+)?$'
          declare -A latest=()
          while read -r tag; do
            [[ $tag =~ $re ]] && latest[${BASH_REMATCH[1]}]=$tag
          done < <(git tag --list 'v*.*.*' --merged HEAD --sort=v:refname)
          for major in "${!latest[@]}"; do
            tag=${latest[$major]}
            [ "$(git rev-parse -q --verify "refs/tags/$major^{commit}")" = "$(git rev-parse "$tag^{commit}")" ] && continue
            git tag --force "$major" "$tag"
            git push --force origin "refs/tags/$major"
          done
