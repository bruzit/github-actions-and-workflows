---
name: MegaLinter
on:
  workflow_call:
    inputs:
      validate_all_codebase:
        type: boolean
        required: false
        default: false
        description: Lint the whole repository instead of the files changed by the pull request.

concurrency:
  group: megalinter-${{ github.ref }}
  cancel-in-progress: true

jobs:
  megalinter:
    name: MegaLinter
    runs-on: ubuntu-latest
    environment:
      name: autofix
      deployment: false
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.repo.full_name == github.repository && github.head_ref || '' }}
      - name: MegaLinter
        uses: oxsecurity/megalinter/flavors/terraform@v10
        env:
          APPLY_FIXES: all
          VALIDATE_ALL_CODEBASE: ${{ inputs.validate_all_codebase || false }}
          ACTION_ZIZMOR_UNSECURED_ENV_VARIABLES: GITHUB_TOKEN
          DISABLE_LINTERS: YAML_PRETTIER
          FORMATTERS_DISABLE_ERRORS: false
          MARKDOWN_FILTER_REGEX_EXCLUDE: "(CHANGELOG\\.md)"
          MARKDOWN_MARKDOWNLINT_CONFIG_FILE: .markdownlint.yaml
          SHOW_ELAPSED_TIME: true
          FLAVOR_SUGGESTIONS: false
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Check applied fixes
        id: fixes
        if: github.event.pull_request.head.repo.full_name == github.repository
        env:
          HAS_APP_KEY: ${{ secrets.GH_AUTOFIX_APP_PEM_FILE != '' }}
        run: |
          if [ "$HAS_APP_KEY" = true ] && [ -n "$(git status --porcelain)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Create GitHub App token
        id: app-token
        if: steps.fixes.outputs.changed == 'true'
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ vars.GH_AUTOFIX_APP_ID }}
          private-key: ${{ secrets.GH_AUTOFIX_APP_PEM_FILE }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
      - name: Push applied fixes
        if: steps.fixes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          HEAD_REF: ${{ github.head_ref }}
          GIT_CONFIG_COUNT: 1
          GIT_CONFIG_KEY_0: credential.helper
          GIT_CONFIG_VALUE_0: '!f() { echo username=x-access-token; echo "password=$GH_TOKEN"; }; f'
        run: |
          name="${APP_SLUG}[bot]"
          email="$(gh api "/users/$name" --jq .id)+$name@users.noreply.github.com"
          git add --all
          git -c user.name="$name" -c user.email="$email" commit --message "style: apply megalinter fixes"
          git push origin "HEAD:refs/heads/$HEAD_REF"
      - name: Gitleaks
        if: ${{ !cancelled() }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: docker run --rm -v "${GITHUB_WORKSPACE}:/repo" ghcr.io/gitleaks/gitleaks:latest git --redact --verbose ${BASE_SHA:+"--log-opts=${BASE_SHA}..HEAD"} /repo
