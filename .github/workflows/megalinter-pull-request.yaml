---
name: MegaLinter

on:
  pull_request:

jobs:
  megalinter:
    name: MegaLinter
    uses: ./.github/workflows/megalinter.yaml
    secrets: inherit
    permissions:
      contents: read
      pull-requests: write

  required:
    name: Required (MegaLinter)
    needs: [megalinter]
    if: always()
    runs-on: ubuntu-slim
    permissions: {}
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
